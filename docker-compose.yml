version: '3.8'

services:
  listener:
    build: .
    container_name: submission-sequencer-listener
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - redis
    volumes:
      # Persist logs on the host VPS
      - ./logs:/app/logs
      - ./logs/archive:/app/logs/archive
    environment:
      - LOG_FILE=/app/logs/listener.log
      - LOG_LEVEL=${LOG_LEVEL:-info}

  redis:
    image: redis:latest
    container_name: submission-sequencer-redis
    ports:
      - "6380:6379"